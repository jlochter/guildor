[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "guildor"
version = "0.0.1"
description = "A turn-based, text-only guild-management game used as a contamination-resistant LLM benchmark."
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
guildor = "guildor.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]
